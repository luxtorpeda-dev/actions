name: Build Action Dist

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  commit-dist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Compile All Actions
        shell: bash
        run: |
          set -euo pipefail

          find . \
            -path "*/node_modules/*" -prune -o \
            \( -name "action.yml" -o -name "action.yaml" \) \
            -print |
          while read -r action_file; do
            action_dir="$(dirname "$action_file")"
            entry="$action_dir/index.js"

            if [ ! -f "$entry" ]; then
              echo "ERROR: Missing entry file: $entry"
              exit 1
            fi

            rm -rf "$action_dir/dist"
            npx ncc build "$entry" -o "$action_dir/dist"
          done

      - name: Commit dist changes
        shell: bash
        run: |
          set -euo pipefail

          git add -A .

          echo "Git status:"
          git status --short

          if git diff --quiet; then
            echo "No dist changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Build action dist files"
          git push
