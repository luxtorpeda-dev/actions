name: Build Action Dist

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  discover-actions:
    runs-on: ubuntu-latest

    outputs:
      actions: ${{ steps.discover.outputs.actions }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Discover action folders
        id: discover
        shell: bash
        run: |
          set -euo pipefail

          actions="$(
            find . \
              -path "*/node_modules/*" -prune -o \
              \( -name "action.yml" -o -name "action.yaml" \) \
              -print |
            xargs -r -n1 dirname |
            sort -u |
            jq -R -s -c 'split("\n") | map(select(length > 0))'
          )"

          echo "actions=$actions" >> "$GITHUB_OUTPUT"

  build-dist:
    needs: discover-actions
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        action-dir: ${{ fromJson(needs.discover-actions.outputs.actions) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Compile Action
        shell: bash
        run: |
          set -euo pipefail

          action_dir="${{ matrix.action-dir }}"
          entry="$action_dir/index.js"

          echo "Processing action: $action_dir"
          echo "Entry file: $entry"

          if [ ! -f "$entry" ]; then
            echo "ERROR: Missing entry file: $entry"
            exit 1
          fi

          rm -rf "$action_dir/dist"

          echo "Compiling $entry"
          npx ncc build "$entry" -o "$action_dir/dist"

          if [ ! -f "$action_dir/dist/index.js" ]; then
            echo "ERROR: dist/index.js was not generated"
            exit 1
          fi

  commit-dist:
    needs: build-dist
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Compile All Actions
        shell: bash
        run: |
          set -euo pipefail

          find . \
            -path "*/node_modules/*" -prune -o \
            \( -name "action.yml" -o -name "action.yaml" \) \
            -print |
          while read -r action_file; do
            action_dir="$(dirname "$action_file")"
            entry="$action_dir/index.js"

            if [ ! -f "$entry" ]; then
              echo "ERROR: Missing entry file: $entry"
              exit 1
            fi

            rm -rf "$action_dir/dist"
            npx ncc build "$entry" -o "$action_dir/dist"
          done

      - name: Commit dist changes
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "No dist changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "Build action dist files"
          git push
